<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My Budget</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0C1F14">
<link rel="icon" href="app-icon.png">
<link rel="apple-touch-icon" href="app-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --dark: #0C1F14;
    --dark-2: #122A1B;
    --dark-3: #183622;
    --lime: #C6F24E;
    --lime-soft: #E4F7AE;
    --cream: #F4F1E8;
    --card: #FFFFFF;
    --tan: #E9E5D8;
    --ink: #122018;
    --muted: #7A877E;
    --danger: #D8674B;
    --radius: 22px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    background: var(--cream); color: var(--ink);
    padding-bottom: 116px; min-height: 100vh;
  }
  .hidden { display: none !important; }
  button { font-family: inherit; cursor: pointer; border: none; }
  .serif { font-family: Georgia, 'Times New Roman', serif; font-style: italic; }

  /* ============ SPLASH & LOCK ============ */
  #splash, #lock-screen {
    position: fixed; inset: 0; background: var(--dark); z-index: 200;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; padding: 32px; text-align: center;
  }
  #splash .logo, #lock-screen .lock-logo { font-family: Georgia, serif; font-style: italic; font-size: 26px; margin-bottom: 20px; }
  #splash .logo b, #lock-screen .lock-logo b { color: var(--lime); }
  #splash h1 { font-family: Georgia, serif; font-style: italic; font-size: 34px; margin-bottom: 14px; }
  #splash h1 u { text-decoration-color: var(--lime); text-underline-offset: 5px; }
  #splash p { font-size: 13px; color: rgba(255,255,255,.55); margin-bottom: 34px; }
  #splash .cta {
    background: var(--lime); color: var(--ink); font-weight: 700; font-size: 15px;
    padding: 16px 34px; border-radius: 40px; display: inline-flex; align-items: center; gap: 8px;
  }

  .pin-dots { display: flex; gap: 16px; margin-bottom: 34px; }
  .pin-dots span { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--lime); transition: background .15s; }
  .pin-dots span.filled { background: var(--lime); }
  .pin-pad { display: grid; grid-template-columns: repeat(3, 70px); gap: 16px; }
  .pin-pad button {
    width: 70px; height: 70px; border-radius: 50%; font-size: 22px; color: #fff;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14);
  }
  .pin-pad button:active { background: rgba(198,242,78,.28); }
  #pin-error { color: #FFB199; font-size: 13px; height: 20px; margin-bottom: 8px; }

  /* ============ HEADER & CARDS ============ */
  .container { padding: 0 18px; max-width: 480px; margin: 0 auto; }
  header { padding: 22px 0 16px; display: flex; align-items: center; justify-content: space-between; }
  .eyebrow { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
  header .greet h1 { font-family: Georgia, serif; font-style: italic; font-size: 26px; }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; background: var(--lime); color: var(--ink);
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px;
  }

  .hero-card, .balance-total-card, .savings-hero {
    background: radial-gradient(130% 130% at 85% 0%, var(--dark-3) 0%, var(--dark) 62%);
    border-radius: var(--radius); padding: 22px; color: #fff; margin-bottom: 16px; box-shadow: 0 14px 30px rgba(12,31,20,.25);
  }
  .hero-card .amt { font-size: 38px; font-weight: 800; margin: 8px 0 12px; }
  .trend-pill { background: rgba(198,242,78,.16); color: var(--lime); font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 20px; }
  .sparkline-svg { width: 100%; height: 46px; display: block; margin-top: 10px; }

  .action-row { display: flex; gap: 12px; margin-bottom: 18px; }
  .action-btn {
    flex: 1; background: #fff; border-radius: 18px; padding: 16px 8px 14px;
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 600; color: var(--ink); border: 1px solid #EAE6D9;
  }

  .card { background: var(--card); border-radius: 18px; padding: 18px; margin-bottom: 14px; border: 1px solid #EDEAE0; }
  .card h2 { font-size: 15px; font-weight: 800; margin-bottom: 12px; display: flex; justify-content: space-between; }
  
  input, select {
    width: 100%; padding: 13px 14px; border: 1.5px solid #E7E3D6; border-radius: 13px;
    font-size: 14px; margin-bottom: 9px; background: #FBFAF5; color: var(--ink);
  }
  .btn { background: var(--ink); color: #fff; padding: 13px 20px; border-radius: 13px; font-size: 14px; font-weight: 700; }
  .btn-lime { background: var(--lime); color: var(--ink); }
  .btn-danger { background: var(--danger); }

  /* ============ EXPENSE LIST ============ */
  .expense-item { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid #F1EEE4; font-size: 14px; }
  .expense-left { display: flex; align-items: center; gap: 12px; }
  .cat-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 17px; }

  /* ============ AI CHAT SECTION ============ */
  .ai-box { background: #fff; border: 1px solid #EDEAE0; border-radius: 18px; padding: 14px; margin-bottom: 14px; }
  .ai-logs { height: 180px; overflow-y: auto; font-size: 13px; line-height: 1.5; padding: 8px; background: #FBFAF5; border-radius: 12px; margin-bottom: 10px; }
  .ai-msg { margin-bottom: 8px; padding: 8px 12px; border-radius: 10px; max-width: 85%; }
  .ai-msg.user { background: var(--dark); color: #fff; margin-left: auto; }
  .ai-msg.bot { background: #E4F7AE; color: var(--ink); font-weight: 600; }

  /* ============ NAV ============ */
  nav {
    position: fixed; bottom: 14px; left: 14px; right: 14px; max-width: 452px; margin: 0 auto;
    background: var(--card); border-radius: 28px; display: flex; align-items: center;
    padding: 10px 8px; z-index: 20; border: 1px solid #EDEAE0;
  }
  nav .tab { flex: 1; background: none; color: var(--muted); font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  nav .tab.active { color: var(--ink); }
  
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .overlay { position: fixed; inset: 0; background: rgba(12,31,20,.5); z-index: 50; display: flex; align-items: flex-end; }
  .sheet { background: var(--cream); width: 100%; border-radius: 24px 24px 0 0; padding: 20px; }
  .toast { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); background: var(--dark); color: var(--lime); padding: 12px 20px; border-radius: 30px; z-index: 300; display: none; }
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash" class="hidden">
  <div class="logo">My<b>Budget</b>.</div>
  <h1>Track Every <u>Rupee</u>.</h1>
  <button class="cta" id="splash-start">Get Started →</button>
</div>

<!-- LOCK SCREEN -->
<div id="lock-screen" class="hidden">
  <div class="lock-logo">My<b>Budget</b>.</div>
  <h1 id="lock-title">Enter Passkey</h1>
  <p id="lock-subtitle">Welcome Back</p>
  <div class="pin-dots" id="pin-dots"><span></span><span></span><span></span><span></span></div>
  <p id="pin-error"></p>
  <div class="pin-pad" id="pin-pad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button style="visibility:hidden;"></button><button data-k="0">0</button><button data-k="del">⌫</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" class="hidden">
  <div id="tab-home" class="tab-content active">
    <div class="container">
      <header>
        <div class="greet">
          <div class="eyebrow" id="greet-eyebrow">WELCOME</div>
          <h1 id="greet-text">Mate</h1>
        </div>
        <div class="avatar" id="me-icon">M</div>
      </header>

      <div class="hero-card">
        <span class="eyebrow" style="color:rgba(255,255,255,.6)">THIS MONTH SPEND</span>
        <div class="amt" id="home-month-amt">Rs. 0</div>
        <svg class="sparkline-svg" id="sparkline-svg" viewBox="0 0 300 46"></svg>
      </div>

      <!-- LOCAL AI ASSISTANT -->
      <div class="ai-box">
        <h2>🤖 Offline AI Financial Advisor</h2>
        <div class="ai-logs" id="ai-logs">
          <div class="ai-msg bot">Hi! I am your Local Budget AI. Ask me for financial advice based on your local data!</div>
        </div>
        <div style="display:flex; gap:8px;">
          <input type="text" id="ai-input" placeholder="Ask AI e.g. How to save more?" style="margin:0;">
          <button class="btn btn-lime" id="ai-send-btn">Ask</button>
        </div>
      </div>

      <div class="card">
        <h2>Recent Activity</h2>
        <div id="recent-list"></div>
      </div>
    </div>
  </div>
</div>

<nav id="bottom-nav" class="hidden">
  <button class="tab active" data-tab="home">Home</button>
</nav>

<script>
(function() {
  function load(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch(e) { return fallback; } }
  function save(key, value) { localStorage.setItem(key, JSON.stringify(value)); }

  // PASSKEY BUG FIX & PERMANENT AUTH
  let enteredPin = '', pinMode = load('pin', null) ? 'verify' : 'setup1';

  function showLock() { 
    document.getElementById('lock-screen').classList.remove('hidden'); 
    updateLockUI(); 
  }

  function updateLockUI() {
    document.querySelectorAll('#pin-dots span').forEach((d,i) => d.classList.toggle('filled', i < enteredPin.length));
    const title = document.getElementById('lock-title');
    if (pinMode === 'setup1') title.textContent = 'Set 4-Digit Passkey';
    else if (pinMode === 'verify') title.textContent = 'Enter Passkey';
  }

  document.getElementById('pin-pad').addEventListener('click', (e) => {
    const btn = e.target.closest('button'); if (!btn || !btn.dataset.k) return;
    const k = btn.dataset.k;
    if (k === 'del') { enteredPin = enteredPin.slice(0, -1); updateLockUI(); return; }
    if (enteredPin.length >= 4) return;
    enteredPin += k; updateLockUI();

    if (enteredPin.length === 4) {
      setTimeout(() => {
        if (pinMode === 'setup1') {
          save('pin', enteredPin);
          unlockApp();
        } else {
          if (enteredPin === load('pin', null)) unlockApp();
          else {
            document.getElementById('pin-error').textContent = 'Invalid Passkey!';
            enteredPin = ''; updateLockUI();
          }
        }
      }, 100);
    }
  });

  function unlockApp() {
    document.getElementById('lock-screen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('bottom-nav').classList.remove('hidden');
  }

  if (!load('splashSeen', false)) {
    document.getElementById('splash').classList.remove('hidden');
    document.getElementById('splash-start').onclick = () => {
      save('splashSeen', true);
      document.getElementById('splash').classList.add('hidden');
      showLock();
    }
  } else { showLock(); }

  // OFFLINE AI ENGINE (LOCAL RULE & DATA ANALYSIS)
  document.getElementById('ai-send-btn').onclick = () => {
    const input = document.getElementById('ai-input');
    const query = input.value.trim();
    if (!query) return;

    const logs = document.getElementById('ai-logs');
    logs.innerHTML += `<div class="ai-msg user">${query}</div>`;

    // Local Storage Data Extraction
    const expenses = load('yearlyExpenses', 0);
    const income = load('yearlyIncome', 0);
    const savings = income - expenses;

    let reply = "I analyzed your offline records. ";
    if (query.toLowerCase().includes('save') || query.toLowerCase().includes('budget')) {
      reply += `Your current total spend is Rs. ${expenses}. Net savings: Rs. ${savings}. Try limiting daily food expenses by 15% to increase monthly savings.`;
    } else {
      reply += `Total Income: Rs. ${income} | Expenses: Rs. ${expenses}. Everything is stored safely on your device storage!`;
    }

    setTimeout(() => {
      logs.innerHTML += `<div class="ai-msg bot">${reply}</div>`;
      logs.scrollTop = logs.scrollHeight;
    }, 400);

    input.value = '';
  };
})();
</script>
</body>
</html>
